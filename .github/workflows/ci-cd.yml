name: CI-CD

on:
  push:
    branches: [development, testing, main]
  pull_request:
    branches: [development, testing, main]

jobs:
  dev-check:
    name: Development - Compile/Checks
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Validate
        run: mvn -B -q validate

      - name: Compile (syntax/compile issues)
        run: mvn -B -q clean compile

  test-run:
    name: Testing - Unit Tests
    if: github.ref == 'refs/heads/testing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run tests
        run: mvn -B test

  main-full:
    name: Main - Full Build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Full verification
        run: mvn -B clean verify

      - name: Package
        run: mvn -B package
